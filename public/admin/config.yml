backend:
  name: github
  branch: main
  repo: 2312ATC/2312atc
  base_url: https://decap.tavistock.air-cadets.org
  auth_endpoint: /auth

media_folder: "src/assets/images"
public_folder: "../../assets/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "blog" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Last Updated", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    label_singular: "Event"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "End Date", name: "endDate", widget: "datetime", required: false }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "string", hint: "Short summary shown on the events list." }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "notifications"
    label: "Notifications"
    label_singular: "Notification"
    folder: "src/content/notifications"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Message", name: "message", widget: "text" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Show from", name: "notBefore", widget: "datetime", hint: "Earliest moment this notification is shown." }
      - { label: "Hide after", name: "notAfter", widget: "datetime", hint: "When this notification expires and is hidden." }
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Information", value: "info" }
          - { label: "Warning", value: "warning" }
          - { label: "Alert / Urgent", value: "alert" }
        default: "info"
      - { label: "Icon", name: "icon", widget: "string", required: false, hint: "Optional Material Icons name. Defaults to info/warning/error by type. See https://fonts.google.com/icons?icon.set=Material+Icons" }
      - { label: "Active", name: "active", widget: "boolean", default: true, hint: "Uncheck to hide this notification from the website." }

  - name: "landingCarousel"
    label: "Home Page Carousel"
    label_singular: "Carousel Slide"
    folder: "src/content/landingCarousel"
    create: true
    identifier_field: "image"
    fields:
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption / Alt Text", name: "caption", widget: "string", required: false, hint: "Describe the image for accessibility. Also shown as an overlay caption." }
      - { label: "Link", name: "link", widget: "string", required: false, hint: "Optional internal link (e.g. /events)", pattern: ['/[a-zA-Z0-9_/-]*', "Must start with a slash"] }

  - name: "staff"
    label: "Staff (About page)"
    label_singular: "Staff Member"
    folder: "src/content/staff"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role / Rank", name: "role", widget: "string" }
      - { label: "Bio", name: "bio", widget: "text", required: false, hint: "Optional short biography shown on the About page." }
      - { label: "Display Order", name: "order", widget: "number", default: 99, hint: "Lower numbers appear first." }

  - name: "activities"
    label: "Activities (What We Do page)"
    label_singular: "Activity"
    folder: "src/content/activities"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Icon", name: "icon", widget: "string", hint: "Material Icons name, see https://fonts.google.com/icons?icon.set=Material+Icons" }
      - { label: "Display Order", name: "order", widget: "number", default: 99 }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "opportunities"
    label: "Opportunities (Cadets page)"
    label_singular: "Opportunity"
    folder: "src/content/opportunities"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string", hint: "Short one-line description." }
      - { label: "Icon", name: "icon", widget: "string", hint: "Material Icons name, see https://fonts.google.com/icons?icon.set=Material+Icons" }
      - { label: "Display Order", name: "order", widget: "number", default: 99 }

  - name: "faq"
    label: "FAQs (Join Us page)"
    label_singular: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", default: 99 }
      - { label: "Answer", name: "body", widget: "markdown" }
